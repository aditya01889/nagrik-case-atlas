name: Unpack Nagrik Case Atlas source
on:
  push:
    paths:
      - '.source-staging/READY'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild and extract source archive
        run: |
          set -euo pipefail
          cat .source-staging/part-01.b64 .source-staging/part-02a.b64 .source-staging/part-02b.b64 .source-staging/part-03.b64 .source-staging/part-04.b64 .source-staging/part-05.b64 .source-staging/part-06.b64 .source-staging/part-07.b64 .source-staging/part-08.b64 | base64 -d > nca-source.tar.xz
          tar -xJf nca-source.tar.xz
          rm -f nca-source.tar.xz
          rm -rf .source-staging
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import complete Nagrik Case Atlas source'
          git push
