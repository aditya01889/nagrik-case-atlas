databases:
  - name: nagrik-case-atlas-db
    databaseName: nagrik_case_atlas
    user: nagrik_case_atlas
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: nagrik-case-atlas-api
    runtime: python
    rootDir: nagrik-case-atlas/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nagrik-case-atlas-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://aditya01889.github.io
      - key: ADMIN_TOKEN
        sync: false
